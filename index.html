<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16181d">
<title>Stat Rack</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --ink:#16181d; --muted:#666; --line:#d9dce1; --accent:#2f6fec; --danger:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --card:#20232a; --ink:#e8eaed; --muted:#9aa0a6; --line:#3a3f48; --accent:#6e9bff; --danger:#ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; margin:0; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  nav { display:flex; gap:6px; margin-bottom:14px; }
  nav button { flex:1; }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  button { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; min-height:44px; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.small { padding:4px 10px; min-height:34px; font-size:14px; }
  button.danger { color:var(--danger); }
  input, select { font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); min-height:40px; }
  label { display:block; margin:8px 0 4px; color:var(--muted); font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  .num { width:4.5em; }
  .muted { color:var(--muted); font-size:14px; }
  .tag { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted); }
  #status { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); max-width:90%; padding:10px 14px; border-radius:8px; background:var(--ink); color:var(--bg); display:none; z-index:10; }
  #status.error { background:var(--danger); color:#fff; }
  .ex-name { font-weight:600; }
  ul.plain { list-style:none; padding:0; margin:0; }
  ul.plain > li { padding:8px 0; border-bottom:1px solid var(--line); }
  ul.plain > li:last-child { border-bottom:none; }
  .set { display:flex; gap:8px; align-items:center; padding:4px 0; }
  .set .n { width:1.6em; color:var(--muted); }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>
<header><h1>Stat Rack</h1><span class="muted" id="logName"></span></header>
<main>
  <section id="viewSignin" class="card">
    <p>Sign in with Google to open your workout log. Your data is stored in your own Google Drive.</p>
    <p class="muted" id="signinMsg"></p>
    <button id="btnSignin" class="primary" disabled>Loading…</button>
  </section>

  <section id="viewSetup" class="card" hidden>
    <p>No Stat Rack log was found in your Drive. Choose (or create) a Drive folder, and Stat Rack will create its log sheet there.</p>
    <button id="btnPick" class="primary">Choose folder</button>
  </section>

  <div id="viewApp" hidden>
    <nav>
      <button data-tab="workout" class="active">Workout</button>
      <button data-tab="history">History</button>
      <button data-tab="exercises">Exercises</button>
    </nav>
    <div id="tab-workout"></div>
    <div id="tab-history" hidden></div>
    <div id="tab-exercises" hidden></div>
  </div>
</main>
<div id="status"></div>

<script>
'use strict';

// ===== Config =====
const CONFIG = {
  clientId: '89468128124-msv3r10d3g3i6cbjbceoigpg5pv3d072.apps.googleusercontent.com',
  apiKey: 'AIzaSyBu0Mf9GsuUkqoq_T9yidLUZq-N3kclYDA',
  appId: '89468128124',
  scope: 'https://www.googleapis.com/auth/drive.file',
};
const LOG_COLUMNS = ['id', 'type', 'ref', 'v', 'written', 'data'];
const SHEET = 'log';
// Version written for each type today. Bump when a format changes and add an upgrader below.
const WRITE_VERSION = { exercise: 1, workout: 1, set: 1, note: 1, correction: 1, void: 1 };
// UPGRADERS[type][v] turns data of version v into version v+1. Written once, never changed.
const UPGRADERS = { exercise: {}, workout: {}, set: {}, note: {} };
const SET_KINDS = ['work', 'warmup', 'test']; // 'work' is stored as no kind at all
const EQUIPMENT = ['barbell', 'dumbbell', 'machine', 'cable', 'bodyweight', 'other'];

// ===== State =====
let tokenClient = null, token = null, tokenExpiry = 0;
let logFiles = [];   // [{id, name, seq, header}]
let rows = [];       // raw rows from all log files, in saved order
let model = { exercises: new Map(), workouts: [], workoutById: new Map() };
let session = null;  // set at startup: {activeId, pending:{[workoutId]:[exerciseId]}, inputs:{[key]:{reps,kg,kind}}}
let editingSetId = null;
let busy = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function status(msg, isError = false, ms = 3000) {
  const el = $('status');
  el.textContent = msg; el.className = isError ? 'error' : ''; el.style.display = 'block';
  clearTimeout(status.t);
  if (ms) status.t = setTimeout(() => { el.style.display = 'none'; }, isError ? 8000 : ms);
}
function show(view) {
  for (const v of ['viewSignin', 'viewSetup', 'viewApp']) $(v).hidden = v !== view;
}

// ===== Time and IDs =====
const pad = n => String(n).padStart(2, '0');
function isoLocal(d, seconds = true) {
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-', a = Math.abs(off);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}` +
    (seconds ? `:${pad(d.getSeconds())}` : '') + `${sign}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}
function inputLocal(d) { // value for <input type=datetime-local>
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function newId() {
  const d = new Date(), chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const r = crypto.getRandomValues(new Uint8Array(3));
  const rand = Array.from(r, b => chars[b % chars.length]).join('');
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}-${rand}`;
}
function fmtWhen(s) {
  const d = new Date(s);
  return isNaN(d) ? esc(s) : d.toLocaleString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ===== Auth =====
function waitForGoogle() {
  if (window.google?.accounts?.oauth2 && window.gapi) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.clientId,
      scope: CONFIG.scope,
      callback: async resp => {
        if (resp.error) { status('Sign-in failed: ' + resp.error, true); return; }
        token = resp.access_token;
        tokenExpiry = Date.now() + (Number(resp.expires_in) - 60) * 1000;
        try { await loadAll(); } catch (e) { handleError(e); }
      },
    });
    const b = $('btnSignin'); b.disabled = false; b.textContent = 'Sign in with Google';
  } else setTimeout(waitForGoogle, 100);
}
function signIn() { tokenClient.requestAccessToken({ prompt: '' }); }
function needSignIn(msg) { token = null; $('signinMsg').textContent = msg || ''; show('viewSignin'); }

class SignedOut extends Error {}
async function api(url, opts = {}) {
  if (!token || Date.now() > tokenExpiry) { needSignIn('Your session has expired. Sign in again; nothing was lost.'); throw new SignedOut(); }
  const res = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (res.status === 401) { needSignIn('Your session has expired. Sign in again; nothing was lost.'); throw new SignedOut(); }
  if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
  return res.status === 204 ? null : res.json();
}
function handleError(e) {
  if (e instanceof SignedOut) return;
  console.error(e); status('Error: ' + e.message, true);
}

// ===== Drive / Sheets =====
async function findLogFiles() {
  const q = encodeURIComponent("appProperties has { key='statrack' and value='log' } and trashed = false");
  const r = await api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&pageSize=100&fields=files(id,name,appProperties)`);
  return (r.files || [])
    .map(f => ({ id: f.id, name: f.name, seq: Number(f.appProperties?.seq || 1) }))
    .sort((a, b) => a.seq - b.seq);
}

function pickFolder() {
  gapi.load('picker', () => {
    const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
      .setIncludeFolders(true).setSelectFolderEnabled(true)
      .setMimeTypes('application/vnd.google-apps.folder');
    new google.picker.PickerBuilder()
      .setAppId(CONFIG.appId).setOAuthToken(token).setDeveloperKey(CONFIG.apiKey)
      .addView(view).setTitle('Choose a folder for your Stat Rack log')
      .setCallback(async data => {
        if (data.action !== google.picker.Action.PICKED) return;
        try {
          status('Creating your log…', false, 0);
          await createLogFile(data.docs[0].id, 1);
          await loadAll();
          status('Log created.');
        } catch (e) { handleError(e); }
      })
      .build().setVisible(true);
  });
}

async function createLogFile(folderId, seq) {
  const file = await api('https://www.googleapis.com/drive/v3/files?fields=id,name', {
    method: 'POST',
    body: JSON.stringify({
      name: `Stat Rack log-${seq}`,
      mimeType: 'application/vnd.google-apps.spreadsheet',
      parents: [folderId],
      appProperties: { statrack: 'log', seq: String(seq) },
    }),
  });
  const ss = await api(`https://sheets.googleapis.com/v4/spreadsheets/${file.id}?fields=sheets.properties`);
  const sheetId = ss.sheets[0].properties.sheetId;
  // Rename the first tab to "log" and drop unused cells (blank cells count toward the 10M limit).
  await api(`https://sheets.googleapis.com/v4/spreadsheets/${file.id}:batchUpdate`, {
    method: 'POST',
    body: JSON.stringify({ requests: [{ updateSheetProperties: {
      properties: { sheetId, title: SHEET, gridProperties: { rowCount: 1, columnCount: LOG_COLUMNS.length } },
      fields: 'title,gridProperties.rowCount,gridProperties.columnCount',
    } }] }),
  });
  await api(`https://sheets.googleapis.com/v4/spreadsheets/${file.id}/values/${SHEET}!A1?valueInputOption=RAW`, {
    method: 'PUT', body: JSON.stringify({ values: [LOG_COLUMNS] }),
  });
  return file;
}

async function readLogFile(f) {
  const r = await api(`https://sheets.googleapis.com/v4/spreadsheets/${f.id}/values/${SHEET}?valueRenderOption=UNFORMATTED_VALUE`);
  const values = r.values || [];
  const header = (values[0] || []).map(h => String(h).trim());
  for (const c of LOG_COLUMNS) if (!header.includes(c)) throw new Error(`${f.name} is missing the "${c}" column`);
  f.header = header;
  const col = Object.fromEntries(header.map((h, i) => [h, i]));
  return values.slice(1).map((v, i) => {
    const row = { file: f.id, line: i + 2, id: String(v[col.id] ?? ''), type: String(v[col.type] ?? ''),
      ref: String(v[col.ref] ?? ''), v: Number(v[col.v]), written: String(v[col.written] ?? ''), raw: v[col.data], ok: true };
    try { row.data = JSON.parse(row.raw); } catch { row.ok = false; console.warn(`Unreadable data in ${f.name} row ${row.line}`); }
    if (!row.id) row.ok = false;
    return row;
  });
}

async function loadAll() {
  status('Loading…', false, 0);
  logFiles = await findLogFiles();
  if (!logFiles.length) { show('viewSetup'); status('Signed in.'); return; }
  rows = [];
  for (const f of logFiles) rows.push(...await readLogFile(f));
  $('logName').textContent = logFiles.at(-1).name;
  rebuild();
  show('viewApp');
  renderAll();
  const bad = rows.filter(r => !r.ok).length;
  if (bad) status(`${bad} row(s) could not be read and were skipped. See the browser console.`, true);
  else status('Loaded.');
}

// The only write the app ever makes: add one row at the end of the newest log file.
async function appendRow(type, ref, data) {
  const target = logFiles.at(-1);
  const row = { id: newId(), type, ref: ref || '', v: WRITE_VERSION[type], written: isoLocal(new Date()), data: JSON.stringify(data) };
  const values = [target.header.map(h => (h in row ? row[h] : ''))];
  await api(`https://sheets.googleapis.com/v4/spreadsheets/${target.id}/values/${SHEET}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
    method: 'POST', body: JSON.stringify({ values }),
  });
  rows.push({ ...row, file: target.id, data, raw: row.data, ok: true });
  rebuild();
  return row.id;
}
// Wraps a write so double taps can't save twice, and re-renders afterwards.
async function write(fn, okMsg) {
  if (busy) return;
  busy = true; renderAll();
  try { await fn(); if (okMsg) status(okMsg); }
  catch (e) { handleError(e); }
  finally { busy = false; renderAll(); }
}

// ===== Reading the log into a model =====
function setPath(obj, path, value) {
  const parts = String(path).split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    cur = cur?.[/^\d+$/.test(parts[i]) ? Number(parts[i]) : parts[i]];
    if (cur == null || typeof cur !== 'object') return false;
  }
  const last = parts.at(-1);
  cur[/^\d+$/.test(last) ? Number(last) : last] = value;
  return true;
}
function upgrade(type, v, data) {
  let cur = v;
  while (UPGRADERS[type]?.[cur]) { data = UPGRADERS[type][cur](data); cur++; }
  return data;
}
const time = s => Date.parse(s) || 0;

function rebuild() {
  const good = rows.filter(r => r.ok);
  // 1. Voids (a void can itself be voided, which undoes it)
  const voidsOf = new Map();
  for (const r of good) if (r.type === 'void') { if (!voidsOf.has(r.ref)) voidsOf.set(r.ref, []); voidsOf.get(r.ref).push(r); }
  const memo = new Map();
  const isVoided = (id, depth = 0) => {
    if (depth > 100) return false;
    if (memo.has(id)) return memo.get(id);
    const res = (voidsOf.get(id) || []).some(v => !isVoided(v.id, depth + 1));
    memo.set(id, res); return res;
  };
  const live = good.filter(r => !isVoided(r.id));
  // 2. Corrections on the original format, oldest first
  const items = new Map(); // keeps saved order
  for (const r of live) if (['exercise', 'workout', 'set'].includes(r.type)) items.set(r.id, { ...r, data: structuredClone(r.data) });
  for (const c of live.filter(r => r.type === 'correction').sort((a, b) => time(a.written) - time(b.written))) {
    const t = items.get(c.ref);
    if (t && c.data && 'path' in c.data) setPath(t.data, c.data.path, c.data.value);
  }
  // 3. Upgrade to the newest format (in memory only), then 4. assemble
  const exercises = new Map(), workoutById = new Map(), setById = new Map();
  for (const it of items.values()) {
    const data = upgrade(it.type, it.v, it.data);
    if (it.type === 'exercise') exercises.set(it.id, { id: it.id, ...data });
    else if (it.type === 'workout') workoutById.set(it.id, { id: it.id, ...data, sets: [], notes: [] });
  }
  for (const it of items.values()) {
    if (it.type !== 'set') continue;
    const w = workoutById.get(it.ref);
    if (!w) continue; // its workout is voided or unknown
    const s = { id: it.id, ...upgrade('set', it.v, it.data), notes: [] };
    w.sets.push(s); setById.set(s.id, s);
  }
  for (const n of live.filter(r => r.type === 'note')) {
    const note = { id: n.id, ...upgrade('note', n.v, n.data) };
    (workoutById.get(n.ref) || setById.get(n.ref))?.notes.push(note);
  }
  const workouts = [...workoutById.values()].sort((a, b) => time(b.start) - time(a.start));
  model = { exercises, workouts, workoutById };
}
// Sets of a workout grouped by exercise, in the order each exercise first appeared.
function groupSets(w) {
  const groups = new Map();
  for (const s of w.sets) { if (!groups.has(s.exerciseId)) groups.set(s.exerciseId, []); groups.get(s.exerciseId).push(s); }
  return groups;
}

// ===== Session (kept on this device: which workout is open, unsaved inputs) =====
function newSession() { return { activeId: null, pending: {}, inputs: {} }; }
function loadSession() { try { return { ...newSession(), ...JSON.parse(localStorage.getItem('statrack.session')) }; } catch { return newSession(); } }
function saveSession() { try { localStorage.setItem('statrack.session', JSON.stringify(session)); } catch {} }
const inputKey = (wid, eid) => `${wid}|${eid}`;

// ===== Rendering =====
function exLabel(id) {
  const x = model.exercises.get(id);
  if (!x) return '(unknown exercise)';
  return x.equipment ? `${x.name} · ${x.equipment}` : x.name;
}
function sortedExercises() {
  return [...model.exercises.values()].sort((a, b) => a.name.localeCompare(b.name) || String(a.equipment).localeCompare(String(b.equipment)));
}
function renderAll() { renderWorkout(); renderHistory(); renderExercises(); }

function setText(s) {
  const kind = s.kind && s.kind !== 'work' ? ` <span class="tag">${esc(s.kind)}</span>` : '';
  return `${esc(s.reps)} × ${esc(s.kg)} kg${kind}`;
}
function kindSelect(attrs, value) {
  return `<select ${attrs}>${SET_KINDS.map(k => `<option ${k === (value || 'work') ? 'selected' : ''}>${k}</option>`).join('')}</select>`;
}

function renderWorkout() {
  const el = $('tab-workout');
  const w = session.activeId && model.workoutById.get(session.activeId);
  if (!w) {
    el.innerHTML = `<div class="card"><label>Start time</label>
      <div class="row"><input type="datetime-local" id="wStart" class="grow" value="${esc(inputLocal(new Date()))}"></div>
      <button class="primary" id="wStartBtn" style="margin-top:10px;width:100%" ${busy ? 'disabled' : ''}>Start workout</button></div>`;
    return;
  }
  const groups = groupSets(w);
  for (const eid of session.pending[w.id] || []) if (!groups.has(eid)) groups.set(eid, []);
  let html = `<div class="card"><div class="row"><strong class="grow">${fmtWhen(w.start)}</strong>
    <button class="small" data-act="note" data-id="${esc(w.id)}">+ Note</button>
    <button class="small primary" id="wFinish">Finish</button></div>
    ${w.notes.map(n => `<div class="muted">Note: ${esc(n.text)}</div>`).join('')}</div>`;
  for (const [eid, sets] of groups) {
    const bw = model.exercises.get(eid)?.bodyweight;
    const key = inputKey(w.id, eid);
    const last = sets.at(-1);
    const inp = session.inputs[key] || (last ? { reps: String(last.reps), kg: String(last.kg), kind: last.kind || 'work' } : { reps: '', kg: '', kind: 'work' });
    html += `<div class="card"><div class="ex-name">${esc(exLabel(eid))}</div>`;
    sets.forEach((s, i) => {
      if (editingSetId === s.id) {
        html += `<div class="set"><span class="n">${i + 1}</span>
          <input class="num" inputmode="numeric" id="eReps" value="${esc(s.reps)}">
          <input class="num" inputmode="decimal" id="eKg" value="${esc(s.kg)}">
          ${kindSelect('id="eKind"', s.kind)}
          <button class="small primary" data-act="saveEdit" data-id="${esc(s.id)}" ${busy ? 'disabled' : ''}>Save</button>
          <button class="small" data-act="cancelEdit">Cancel</button></div>`;
      } else {
        html += `<div class="set"><span class="n">${i + 1}</span><span class="grow">${setText(s)}</span>
          <button class="small" data-act="editSet" data-id="${esc(s.id)}">Edit</button>
          <button class="small danger" data-act="voidSet" data-id="${esc(s.id)}" aria-label="Remove set">✕</button></div>
          ${s.notes.map(n => `<div class="muted" style="margin-left:2em">Note: ${esc(n.text)}</div>`).join('')}`;
      }
    });
    html += `<div class="set"><span class="n">${sets.length + 1}</span>
      <input class="num" inputmode="numeric" placeholder="reps" data-key="${esc(key)}" data-f="reps" value="${esc(inp.reps)}">
      <input class="num" inputmode="decimal" placeholder="${bw ? '+kg' : 'kg'}" data-key="${esc(key)}" data-f="kg" value="${esc(inp.kg)}">
      ${kindSelect(`data-key="${esc(key)}" data-f="kind"`, inp.kind)}
      <button class="small primary" data-act="addSet" data-eid="${esc(eid)}" ${busy ? 'disabled' : ''}>Save set</button></div></div>`;
  }
  const exList = sortedExercises();
  html += `<div class="card">${exList.length
    ? `<div class="row"><select id="wAddEx" class="grow">${exList.map(x => `<option value="${esc(x.id)}">${esc(exLabel(x.id))}</option>`).join('')}</select>
       <button id="wAddExBtn">+ Exercise</button></div>`
    : `<p class="muted">Add exercises in the Exercises tab first.</p>`}</div>`;
  el.innerHTML = html;
}

function renderHistory() {
  if (!model.workouts.length) { $('tab-history').innerHTML = `<div class="card muted">No workouts yet.</div>`; return; }
  $('tab-history').innerHTML = model.workouts.map(w => {
    const ex = [...groupSets(w)].map(([eid, sets]) => `<li><span class="ex-name">${esc(exLabel(eid))}</span><br>
      <span class="muted">${sets.map(setText).join(' · ')}</span></li>`).join('');
    const notes = w.notes.map(n => `<li class="muted">Note: ${esc(n.text)}</li>`).join('');
    const isActive = w.id === session.activeId;
    return `<div class="card"><div class="row"><strong class="grow">${fmtWhen(w.start)}${isActive ? ' <span class="tag">open</span>' : ''}</strong>
      <button class="small" data-act="open" data-id="${esc(w.id)}">Open</button>
      <button class="small danger" data-act="voidW" data-id="${esc(w.id)}">Remove</button></div>
      <ul class="plain">${ex || '<li class="muted">No sets.</li>'}${notes}</ul></div>`;
  }).join('');
}

function renderExercises() {
  const list = sortedExercises().map(x => `<li class="row"><span class="grow">${esc(x.name)}
      ${x.equipment ? `<span class="tag">${esc(x.equipment)}</span>` : ''} ${x.bodyweight ? '<span class="tag">bodyweight</span>' : ''}</span>
    <button class="small" data-act="rename" data-id="${esc(x.id)}">Rename</button></li>`).join('');
  $('tab-exercises').innerHTML = `<div class="card"><label>Name</label>
    <div class="row"><input id="xName" class="grow" placeholder="e.g. Bench press, Incline bench press"></div>
    <label>Equipment</label>
    <div class="row"><select id="xEq" class="grow">${EQUIPMENT.map(e => `<option>${e}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:8px"><label style="margin:0"><input type="checkbox" id="xBw"> Bodyweight exercise (kg = added load)</label></div>
    <p class="muted">Dumbbells: kg is the weight of one dumbbell.</p>
    <button class="primary" id="xAdd" ${busy ? 'disabled' : ''}>Add exercise</button></div>
    <div class="card">${list ? `<ul class="plain">${list}</ul>` : '<span class="muted">No exercises yet.</span>'}</div>`;
}

// ===== Actions =====
const num = s => Number(String(s).trim().replace(',', '.'));
function parseSet(reps, kg) {
  const r = num(reps), k = num(kg);
  if (!Number.isInteger(r) || r <= 0) return 'Reps must be a whole number above 0.';
  if (String(kg).trim() === '' || !Number.isFinite(k) || k < 0) return 'kg must be 0 or more.';
  return { reps: r, kg: k };
}

function startWorkout() {
  const d = new Date($('wStart').value);
  if (isNaN(d)) return status('Set a valid start time.', true);
  write(async () => {
    const id = await appendRow('workout', '', { start: isoLocal(d, false) });
    session.activeId = id; saveSession();
  }, 'Workout started.');
}

function addSet(eid) {
  const w = model.workoutById.get(session.activeId); if (!w) return;
  const key = inputKey(w.id, eid);
  const inp = session.inputs[key] || {};
  const box = document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`);
  const val = f => [...box].find(b => b.dataset.f === f)?.value ?? inp[f] ?? '';
  const p = parseSet(val('reps'), val('kg'));
  if (typeof p === 'string') return status(p, true);
  const kind = val('kind');
  const data = { exerciseId: eid, ...p };
  if (kind && kind !== 'work') data.kind = kind;
  write(async () => {
    await appendRow('set', w.id, data);
    session.inputs[key] = { reps: String(p.reps), kg: String(p.kg), kind: kind || 'work' }; // pre-fill the next set
    session.pending[w.id] = (session.pending[w.id] || []).filter(x => x !== eid);
    saveSession();
  }, 'Set saved.');
}

function saveEdit(setId) {
  const w = model.workoutById.get(session.activeId);
  const s = w?.sets.find(x => x.id === setId); if (!s) return;
  const p = parseSet($('eReps').value, $('eKg').value);
  if (typeof p === 'string') return status(p, true);
  const kind = $('eKind').value;
  const changes = [];
  if (p.reps !== s.reps) changes.push({ path: 'reps', value: p.reps });
  if (p.kg !== s.kg) changes.push({ path: 'kg', value: p.kg });
  if ((kind || 'work') !== (s.kind || 'work')) changes.push({ path: 'kind', value: kind === 'work' ? null : kind });
  if (!changes.length) { editingSetId = null; return renderWorkout(); }
  write(async () => {
    for (const c of changes) await appendRow('correction', setId, c);
    editingSetId = null;
  }, 'Set corrected.');
}

function addExercise() {
  const name = $('xName').value.trim(), equipment = $('xEq').value, bodyweight = $('xBw').checked;
  if (!name) return status('Enter a name.', true);
  if (sortedExercises().some(x => x.name.toLowerCase() === name.toLowerCase() && x.equipment === equipment))
    return status(`${name} · ${equipment} already exists.`, true);
  write(() => appendRow('exercise', '', { name, equipment, bodyweight }), 'Exercise added.');
}

function renameExercise(id) {
  const old = model.exercises.get(id)?.name ?? '';
  const name = prompt(`New name for "${old}":`, old)?.trim();
  if (!name || name === old) return;
  write(() => appendRow('correction', id, { path: 'name', value: name }), 'Renamed.');
}

function addNote(ref) {
  const text = prompt('Note:')?.trim();
  if (!text) return;
  write(() => appendRow('note', ref, { text }), 'Note added.');
}

function voidRow(id, question, msg) {
  if (!confirm(question)) return;
  write(() => appendRow('void', id, { reason: 'removed in app' }), msg);
}

function switchTab(name) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  for (const n of ['workout', 'history', 'exercises']) $('tab-' + n).hidden = n !== name;
}

// ===== Events =====
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.id === 'btnSignin') return signIn();
  if (t.id === 'btnPick') return pickFolder();
  if (t.dataset.tab) return switchTab(t.dataset.tab);
  if (t.id === 'wStartBtn') return startWorkout();
  if (t.id === 'wFinish') { session.activeId = null; saveSession(); renderAll(); return status('Workout finished.'); }
  if (t.id === 'wAddExBtn') {
    const eid = $('wAddEx').value, wid = session.activeId;
    session.pending[wid] = [...new Set([...(session.pending[wid] || []), eid])];
    saveSession(); return renderWorkout();
  }
  if (t.id === 'xAdd') return addExercise();
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'addSet': return addSet(t.dataset.eid);
    case 'editSet': editingSetId = id; return renderWorkout();
    case 'cancelEdit': editingSetId = null; return renderWorkout();
    case 'saveEdit': return saveEdit(id);
    case 'voidSet': return voidRow(id, 'Remove this set? It stays in the sheet but is hidden here.', 'Set removed.');
    case 'voidW': return voidRow(id, 'Remove this workout and its sets? They stay in the sheet but are hidden here.', 'Workout removed.');
    case 'note': return addNote(id);
    case 'open': session.activeId = id; saveSession(); renderAll(); return switchTab('workout');
    case 'rename': return renameExercise(id);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.key && t.dataset.f) {
    session.inputs[t.dataset.key] = { ...(session.inputs[t.dataset.key] || {}), [t.dataset.f]: t.value };
    saveSession();
  }
});

session = loadSession();
waitForGoogle();
</script>
</body>
</html>
